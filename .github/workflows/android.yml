name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create App Wrapper
        run: |
          cordova create build_tmp com.leonik.stealegg StealEgg
          cd build_tmp
          rm -rf www/*
          cp ../index.html www/
          cp ../config.xml .
          cordova platform add android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Compile Mobile APK
        run: |
          cd build_tmp
          cordova build android --debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v3
        with:
          name: Mobile-Game-APK
          path: build_tmp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
