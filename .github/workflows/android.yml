name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create App Wrapper
        run: |
          cordova create build_tmp com.leonik.stealegg StealEgg
          cd build_tmp
          rm -rf www/*
          cp ../index.html www/
          cp ../config.xml .
          cordova platform add android --no-telemetry

      - name: Compile Mobile APK
        run: |
          cd build_tmp
          cordova build android --debug --device

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Game-APK
          path: build_tmp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
